{% extends "base.html" %}
{% block content %}
<div class="breadcrumb">
    <a href="{{ url_for('listar_usuarios') }}">&larr; Voltar</a>
</div>
<div class="card form-card">
    <h3>Editar Usuário: {{ user.usuario }}</h3>
    <form method="POST" class="form-lancamento">
        <div class="form-row-3" style="max-width:800px;">
            <div class="form-group">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" value="{{ user.nome }}" placeholder="Nome do usuário">
            </div>
            <div class="form-group">
                <label for="senha">Nova senha <span class="opt">(deixe vazio para manter)</span></label>
                <input type="text" id="senha" name="senha" placeholder="Nova senha">
            </div>
            <div class="form-group" style="align-self:flex-end;">
                <label>
                    <input type="checkbox" name="admin" value="1" {{ 'checked' if user.admin }}>
                    Administrador
                </label>
                <button type="submit" class="btn btn-primary" style="margin-top:8px;">Salvar</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
